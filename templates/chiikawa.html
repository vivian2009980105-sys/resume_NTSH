<h1>吉伊卡哇 (Chiikawa)</h1>
<div class="intro">
<h3>關於吉伊卡哇</h3>
<p>吉伊卡哇（ちいかわ）是由日本插畫家 Nagano 創作的熱門角色，名稱意為「感覺又小又可愛的傢伙」。</p>
<p>故事講述吉伊卡哇與他的好朋友小八貓、兔兔等人在奇幻世界中努力工作、考取證照、拔草以及享受美食的日常故事。</p>
